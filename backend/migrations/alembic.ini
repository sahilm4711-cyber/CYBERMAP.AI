# CyberMap AI — Alembic configuration (Phase 3).
# Run from backend/:  ../.venv/bin/alembic -c migrations/alembic.ini upgrade head
# The URL comes from DATABASE_URL (see env.py); the value here is only
# a placeholder and is overridden at runtime.

[alembic]
script_location = %(here)s
prepend_sys_path = .
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
