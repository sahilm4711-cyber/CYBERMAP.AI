# CyberMap AI — Render Blueprint (render.yaml)
#
# Deploys the FastAPI backend to Render. The frontend lives on Vercel
# (see vercel.json) and the database lives on Supabase (free-tier
# Postgres + pgvector) — this file covers the backend only. Apply it
# from the Render dashboard: New -> Blueprint -> select the
# sahilm4711-cyber/CYBERMAP.AI repo.
#
# READ docs/DEPLOYMENT.md BEFORE the first deploy. One thing in this
# file is a deliberate workaround for a real bug found while preparing
# it (verified 2026-11-18, see DEPLOYMENT.md §1.2):
#   startCommand rewrites a leading "postgres://" in DATABASE_URL
#   to "postgresql+psycopg://" — Supabase issues connection strings
#   with the postgres:// scheme, which SQLAlchemy 2.0 rejects.
# (The missing-Postgres-driver bug is now fixed properly:
# backend/requirements.txt includes psycopg[binary]==3.2.10, so the
# build installs it from requirements.txt — no extra install here.)
#
# Deliberately NOT included:
#   - Redis / Key Value: the code never uses Redis (no client library
#     in requirements.txt, no import anywhere; rate limiting is
#     in-memory, ingestion state lives in the ingestion_jobs table).
#     Do not pay for a service nothing reads.
#   - A second backend instance: the login rate limit is in-memory
#     and per-process (SECURITY.md R1). Keep exactly 1 instance.
#
# Costs: $0 total. The web service below is the free tier (spins down
# after ~15 min idle — first request after sleep is slow), the
# frontend is on Vercel Hobby ($0), and the database is Supabase free
# tier (500 MB Postgres + pgvector, $0; pauses after 1 week idle —
# see DEPLOYMENT.md §1.9). A Starter web service (~$7/month) keeps
# the backend always on if cold starts are unacceptable.

services:
  - type: web
    name: cybermap-ai-backend
    env: python
    plan: free # spins down when idle; use "starter" to stay always on
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic -c migrations/alembic.ini upgrade head
    startCommand: export DATABASE_URL="${DATABASE_URL/#postgres:/postgresql+psycopg:}" && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Random SECRET_KEY generated by Render on first apply. Never
      # put a real secret in this file.
      - key: SECRET_KEY
        generateValue: true
      # Supabase issues this as postgres://... — the startCommand above
      # rewrites the scheme to postgresql+psycopg:// (see header).
      # Set in the Render dashboard (service -> Environment) to the
      # Supabase DIRECT connection string — see DEPLOYMENT.md §1.9.
      # Never put the real value in this file.
      - key: DATABASE_URL
        sync: false
      # Real Vercel URL (set 2026-11-18 after the first frontend deploy)
      # — no trailing slash. Login/register return 403 while this is
      # wrong (the CSRF check compares Origin against this list).
      - key: CORS_ORIGINS
        value: https://cybermapai.vercel.app
      # Required: the frontend is on a different site (vercel.app) from
      # the backend (onrender.com), and the frontend sends
      # credentials: "include". SameSite=Lax would silently drop the
      # session cookie on every cross-site fetch, so login would never
      # stick. SameSite=None only works over HTTPS — Render provides it.
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "none"
      # AI: empty = fully functional non-AI fallback mode (verified).
      - key: AI_PROVIDER
        value: ""
      - key: AI_MODEL
        value: ""
      # Set these in the Render dashboard only if/when used. They are
      # never stored in this file.
      - key: NVD_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
